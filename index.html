<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網站更新中</title>
    <!-- 引入高質感的 Google 字體：中文使用 Noto Serif TC，英文使用 Jost -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #FBF9F6; /* 奶油白背景 */
            color: #5C4D43; /* 深可可色文字 */
            font-family: 'Noto Serif TC', serif;
            overflow: hidden;
            position: relative;
        }

        /* 柔和的背景光暈，增加質感 */
        .glow {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(235, 227, 213, 0.6) 0%, rgba(251, 249, 246, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: breathe 6s infinite ease-in-out;
            z-index: 1;
        }

        .container {
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
            margin-left: 0.2em; /* 補償字距造成的視覺偏移 */
        }

        .subtitle {
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #8C7B6E; /* 較淺的奶茶色 */
            margin-bottom: 3.5rem;
        }

        /* 韓系極簡虛線裝飾圓圈 */
        .circle-decoration {
            width: 50px;
            height: 50px;
            border: 1px dashed #8C7B6E;
            border-radius: 50%;
            margin: 0 auto;
            animation: rotate 15s linear infinite;
        }

        /* 呼吸燈動畫 */
        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.4; }
        }

        /* 旋轉動畫 */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 手機版適配 */
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }
            .subtitle {
                font-size: 0.8rem;
            }
            .glow {
                width: 80vw;
                height: 80vw;
            }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <div class="title">網站更新中</div>
        <div class="subtitle">Under Maintenance</div>
        <div class="circle-decoration"></div>
    </div>
</body>
</html>
